<!doctype html>
<html lang="az" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ecolife | Architectural Lighting & LED Solutions</title>
    <meta name="description" content="Ecolife - Memar və dizaynerlər üçün premium xətti LED profillər, memarlıq işıqlandırma həlləri və interaktiv konfiqurator." />
    <meta name="keywords" content="ecolife, led profil, xətti işıqlandırma, memarlıq işıqlandırma, maqnit sistemlər, baki led, azerbaijan lighting" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph / Facebook / WhatsApp / Telegram -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ecolife.az/" />
    <meta property="og:title" content="Ecolife | Architectural Lighting & LED Solutions" />
    <meta property="og:description" content="Memar və dizaynerlər üçün premium xətti LED profillər, memarlıq işıqlandırma həlləri və konfiqurator." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:site_name" content="Ecolife Lighting" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ecolife | Architectural Lighting & LED Solutions" />
    <meta name="twitter:description" content="Memar və dizaynerlər üçün premium xətti LED profillər və işıqlandırma həlləri." />
    <meta name="twitter:image" content="/og-image.png" />
    <!-- Hero image: fetched in parallel with the JS bundle (LCP) -->
    <link rel="preload" as="image" type="image/webp" href="/hero-pendant-light-mobile.webp" media="(max-width: 1023px)" fetchpriority="high" />
    <link rel="preload" as="image" type="image/webp" href="/hero-pendant-light-desktop.webp" media="(min-width: 1024px)" fetchpriority="high" />
    <meta name="theme-color" content="#1D1D1B" />

    <!-- Theme before first paint: no dark flash for visitors on the light theme -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('ecolife_theme') === 'light') {
            var d = document.documentElement;
            d.classList.add('light'); d.classList.remove('dark'); d.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
    <style>html{background:#1d1d1b}html.light{background:#f3efe6}</style>

    <!-- GitHub Pages SPA Redirect Handler -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body class="antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
