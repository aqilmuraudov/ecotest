<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Ecolife Lighting</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages redirection script
      var l = window.location;
      var isProjectPages = l.hostname.endsWith('github.io') && l.pathname.split('/').filter(Boolean).length > 1;
      var pathSegmentsToKeep = isProjectPages ? 1 : 0;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
